---
- name: Create NMState namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ nmstate_namespace }}"

- name: Create NMState OperatorGroup
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operators.coreos.com/v1
      kind: OperatorGroup
      metadata:
        name: "{{ nmstate_namespace }}"
        namespace: "{{ nmstate_namespace }}"
      spec:
        targetNamespaces:
          - "{{ nmstate_namespace }}"

- name: Subscribe to kubernetes-nmstate-operator
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operators.coreos.com/v1alpha1
      kind: Subscription
      metadata:
        name: kubernetes-nmstate-operator
        namespace: "{{ nmstate_namespace }}"
      spec:
        channel: "{{ nmstate_channel }}"
        name: kubernetes-nmstate-operator
        source: redhat-operators
        sourceNamespace: openshift-marketplace

- name: Wait for NMState CSV to succeed
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    namespace: "{{ nmstate_namespace }}"
  register: nmstate_csvs
  until: >
    nmstate_csvs.resources
    | selectattr('metadata.name', 'match', 'kubernetes-nmstate-operator.*')
    | map(attribute='status.phase') | select('equalto', 'Succeeded') | list | length > 0
  retries: 30
  delay: 10

- name: Deploy NMState CR (starts the handler)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: nmstate.io/v1
      kind: NMState
      metadata:
        name: nmstate

- name: Create Virtualization namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ virt_namespace }}"
        labels:
          openshift.io/cluster-monitoring: "true"

- name: Create Virtualization OperatorGroup
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operators.coreos.com/v1
      kind: OperatorGroup
      metadata:
        name: kubevirt-hyperconverged-group
        namespace: "{{ virt_namespace }}"
      spec:
        targetNamespaces:
          - "{{ virt_namespace }}"

- name: Subscribe to OpenShift Virtualization
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operators.coreos.com/v1alpha1
      kind: Subscription
      metadata:
        name: hco-operatorhub
        namespace: "{{ virt_namespace }}"
      spec:
        channel: "{{ virt_channel }}"
        name: kubevirt-hyperconverged
        source: redhat-operators
        sourceNamespace: openshift-marketplace

- name: Wait for Virtualization CSV to succeed
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    namespace: "{{ virt_namespace }}"
  register: virt_csvs
  until: >
    virt_csvs.resources
    | selectattr('metadata.name', 'match', 'kubevirt-hyperconverged-operator.*')
    | map(attribute='status.phase') | select('equalto', 'Succeeded') | list | length > 0
  retries: 60
  delay: 10

- name: Deploy OpenShift Virtualization
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: hco.kubevirt.io/v1beta1
      kind: HyperConverged
      metadata:
        name: kubevirt-hyperconverged
        namespace: "{{ virt_namespace }}"
      spec: {}

- name: Wait for OpenShift Virtualization to be Available
  kubernetes.core.k8s_info:
    api_version: hco.kubevirt.io/v1beta1
    kind: HyperConverged
    name: kubevirt-hyperconverged
    namespace: "{{ virt_namespace }}"
  register: virt_status
  until: >
    virt_status.resources | length > 0
    and virt_status.resources[0].status.conditions is defined
    and virt_status.resources[0].status.conditions
    | selectattr('type', 'equalto', 'Available')
    | selectattr('status', 'equalto', 'True') | list | length > 0
  retries: 60
  delay: 20

- name: Configure Virtualization external bridge mapping
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: nmstate.io/v1
      kind: NodeNetworkConfigurationPolicy
      metadata:
        name: mapping
      spec:
        desiredState:
          ovn:
            bridge-mappings:
              - bridge: "{{ virt_bridge }}"
                localnet: "{{ virt_localnet }}"
                state: present

- name: Wait for external bridge mapping to be Available
  kubernetes.core.k8s_info:
    api_version: nmstate.io/v1
    kind: NodeNetworkConfigurationPolicy
    name: mapping
  register: mapping_status
  until: >
    mapping_status.resources | length > 0
    and mapping_status.resources[0].status.conditions is defined
    and mapping_status.resources[0].status.conditions
    | selectattr('type', 'equalto', 'Available')
    | selectattr('status', 'equalto', 'True') | list | length > 0
  retries: 30
  delay: 10
